name: Main-based DMG Class Diagnostics
on:
  workflow_dispatch:
    inputs:
      testName:
        description: "Test name"
        required: false
        type: string
        default: "*TestIdeRegressionsIntegrationTest"
  workflow_call:

jobs:
  unitTest:
    name: Main-based affected class on macOS, minimum and nightly Gradle
    uses: ./.github/workflows/reusable-integrationTests.yml
    secrets: inherit
    permissions:
      checks: write
    with:
      testName: ${{ inputs.testName }}
