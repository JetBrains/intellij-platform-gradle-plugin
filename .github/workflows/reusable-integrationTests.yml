name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      platformVersion:
        required: false
        default: 2022.1.4
        type: string
      testName:
        required: false
        default: ""
        type: string

jobs:
  integrationTests:
    name: Gradle ${{ matrix.gradleVersion }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      DMG_DIAGNOSTICS_DIR: ${{ github.workspace }}/build/diagnostics/dmg-copy
      DMG_DIAGNOSTICS_SCRIPT: ${{ github.workspace }}/.github/scripts/dmg-diagnostics.py
    strategy:
      fail-fast: false
      matrix:
        gradleVersion:
          - "9.0.0"
          - "nightly"
        os:
          - macos-latest

    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      - name: Restore IntelliJ Platform test cache
        id: intellij-platform-cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/testGradleHome/.intellijPlatform
          key: test-gradle-home-v5-intellij-platform-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'gradle/libs.versions.toml', 'src/test/**/*.kt', 'src/test/resources/**', 'src/testFixtures/**/*.kt', 'src/integrationTest/**/*.kt', 'src/integrationTest/resources/**') }}
          restore-keys: |
            test-gradle-home-v5-intellij-platform-${{ runner.os }}-

      - name: Restore Gradle TestKit cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/testGradleHome/.testKit
          key: test-gradle-home-v2-testkit-${{ runner.os }}-${{ matrix.gradleVersion }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            test-gradle-home-v2-testkit-${{ runner.os }}-

      - name: Install diagnostic rsync interception
        shell: bash
        run: |
          chmod +x .github/scripts/dmg-shim/rsync
          printf '%s\n' "$PWD/.github/scripts/dmg-shim" >> "$GITHUB_PATH"
          python3 "$DMG_DIAGNOSTICS_SCRIPT" snapshot

      - name: Run Tests
        timeout-minutes: 45
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          TEST_NAME: ${{ inputs.testName }}
        shell: bash
        run: |
          TEST_GRADLE_USER_HOME="$PWD/.gradle/dmgStep2FreshHome"
          test ! -e "$TEST_GRADLE_USER_HOME"
          printf 'Fresh TestKit home: %s\n' "$TEST_GRADLE_USER_HOME"
          command -v rsync
          TESTS=()
          if [ -n "$TEST_NAME" ]; then
            TESTS+=(--tests "$TEST_NAME")
          fi

          python3 "$DMG_DIAGNOSTICS_SCRIPT" run ./gradlew integrationTest \
            -PtestGradleVersion="${{ matrix.gradleVersion }}" \
            -PtestGradleUserHome="$TEST_GRADLE_USER_HOME" \
            "${TESTS[@]}" \
            --no-scan \
            --console=plain \
            --no-build-cache

      - name: Record final resource state
        if: always()
        run: python3 "$DMG_DIAGNOSTICS_SCRIPT" snapshot

      - name: Upload Failure Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ matrix.os }}-${{ matrix.gradleVersion }}
          path: |
            build/diagnostics/
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
