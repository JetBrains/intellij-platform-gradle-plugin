name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      platformVersion:
        required: false
        default: 2022.1.4
        type: string
      testName:
        required: false
        default: ""
        type: string

jobs:
  integrationTests:
    name: Windows owner evidence, Gradle 9.8.1
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      - name: Restore IntelliJ Platform test cache
        id: intellij-platform-cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/testGradleHome/.intellijPlatform
          key: test-gradle-home-v5-intellij-platform-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'gradle/libs.versions.toml', 'src/test/**/*.kt', 'src/test/resources/**', 'src/testFixtures/**/*.kt', 'src/integrationTest/**/*.kt', 'src/integrationTest/resources/**') }}
          restore-keys: |
            test-gradle-home-v5-intellij-platform-${{ runner.os }}-

      - name: Restore Gradle TestKit cache
        id: testkit-cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/testGradleHome/.testKit
          key: test-gradle-home-v2-testkit-${{ runner.os }}-9.8.1-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            test-gradle-home-v2-testkit-${{ runner.os }}-

      - name: Prepare signed Windows handle utility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $PWD 'build/windows-owner-tools'
          New-Item -ItemType Directory -Force $directory | Out-Null
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile "$directory/Handle.zip" -TimeoutSec 30
          Expand-Archive "$directory/Handle.zip" -DestinationPath $directory
          $signature = Get-AuthenticodeSignature "$directory/handle64.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Handle utility did not have a valid Microsoft signature'
          }
          Get-FileHash "$directory/handle64.exe" -Algorithm SHA256

      - name: Run one Windows baseline and owner-gated candidate
        timeout-minutes: 16
        env:
          WINDOWS_DIAGNOSTIC_TESTKIT_CACHE: ${{ steps.testkit-cache.outputs.cache-matched-key }}
          WINDOWS_DIAGNOSTIC_PLATFORM_CACHE: ${{ steps.intellij-platform-cache.outputs.cache-matched-key }}
        shell: pwsh
        run: ./.github/scripts/run-windows-owner-batch.ps1

      - name: Preserve Windows evidence regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-owner-batch-${{ github.run_id }}
          retention-days: 7
          path: |
            build/windows-owner-evidence/
            build/diagnostics/
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
